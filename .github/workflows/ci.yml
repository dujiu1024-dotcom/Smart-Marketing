name: CI

on:
  pull_request:
  push:
    branches: [main, "stage1/**"]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @store-operator/web typecheck
      - run: pnpm --filter @store-operator/web test
      - run: pnpm --filter @store-operator/web build

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
      - run: uv sync --locked --extra dev --directory apps/api
      - run: uv run --locked --directory apps/api ruff check .
      - run: uv run --locked --directory apps/api pytest

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
      - run: uv sync --locked --extra dev --directory apps/api
      - run: uv sync --locked --directory apps/worker
      - run: uv run --locked --directory apps/api ruff check ../worker
      - run: |
          PYTHONPATH=../worker/src uv run --locked --directory apps/api python -c 'from store_operator_worker.celery_app import healthcheck; assert healthcheck.run() == {"status": "ok"}'

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: touch .env && POSTGRES_PASSWORD=ci-only docker compose -f infra/compose/docker-compose.yml config --quiet
      - run: docker build -f infra/containers/api.Dockerfile .
      - run: docker build -f infra/containers/worker.Dockerfile .
      - run: docker build -f infra/containers/web.Dockerfile .
